<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas of Empires</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&display=swap');
  :root {
    --parchment:#f4ede0;--parchment-dark:#e8dcc8;
    --ink:#2c1810;--ink-light:#5c3d2e;
    --gold:#b8860b;--gold-light:#d4a017;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#1a1008;color:var(--ink);font-family:'Crimson Pro',Georgia,serif;height:100vh;overflow:hidden;display:flex;flex-direction:column;}
  header{background:var(--ink);border-bottom:2px solid var(--gold);padding:8px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
  h1{font-family:'Cinzel',serif;font-size:20px;font-weight:700;color:var(--gold-light);letter-spacing:3px;}
  .subtitle{font-family:'Crimson Pro',serif;font-style:italic;color:#a09070;font-size:13px;margin-left:12px;}
  .year-display{font-family:'Cinzel',serif;font-size:30px;font-weight:600;color:var(--gold-light);letter-spacing:4px;text-align:center;}
  .year-display span{font-size:12px;color:#a09070;display:block;font-family:'Crimson Pro',serif;font-style:italic;}
  .main-layout{display:flex;flex:1;overflow:hidden;}
  .map-container{flex:1;position:relative;overflow:hidden;background:#1e3a4a;}
  #map-svg{width:100%;height:100%;display:block;}
  .land{fill:#d4c9a8;stroke:#a09070;stroke-width:0.4;}
  .graticule{fill:none;stroke:rgba(255,255,255,0.06);stroke-width:0.5;}
  .sphere{fill:#1e3a4a;}
  .empire-region{cursor:pointer;}
  .empire-region:hover path{stroke-width:2.5 !important;opacity:0.85;}
  .city-group{cursor:pointer;}
  .city-dot{fill:#f4ede0;stroke:#2c1810;stroke-width:0.8;transition:all 0.3s;}
  .city-dot.active{fill:var(--gold-light);stroke:var(--gold);stroke-width:1.5;}
  .city-label{font-family:'Crimson Pro',serif;font-size:9px;fill:#f4ede0;fill-opacity:0.75;pointer-events:none;}
  .city-label.active{fill:var(--gold-light);fill-opacity:1;font-size:10px;}
  @keyframes pulseRing{0%{r:5;opacity:.9;}100%{r:15;opacity:0;}}
  .pulse-ring{fill:none;stroke:var(--gold-light);stroke-width:1.5;animation:pulseRing 1.4s ease-out infinite;pointer-events:none;}
  .sidebar{width:272px;background:var(--parchment);border-left:2px solid var(--gold);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;}
  .sidebar-section{padding:12px 14px;border-bottom:1px solid var(--parchment-dark);}
  .sidebar-label{font-family:'Cinzel',serif;font-size:8px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-bottom:7px;}
  .info-panel{flex:1;overflow-y:auto;padding:12px 14px;}
  .info-panel::-webkit-scrollbar{width:4px;}
  .info-panel::-webkit-scrollbar-track{background:var(--parchment-dark);}
  .info-panel::-webkit-scrollbar-thumb{background:var(--gold);border-radius:2px;}
  .empire-card{margin-bottom:9px;padding:8px 10px;border-left:3px solid transparent;background:var(--parchment-dark);cursor:pointer;transition:transform 0.15s;}
  .empire-card:hover{transform:translateX(2px);}
  .empire-card.selected{background:#ddd0b0;}
  .empire-name{font-family:'Cinzel',serif;font-size:11px;font-weight:600;color:var(--ink);}
  .empire-dates{font-size:11px;color:var(--ink-light);font-style:italic;margin-top:2px;}
  .event-banner{position:absolute;bottom:0;left:0;right:0;background:rgba(26,16,8,0.93);border-top:1px solid var(--gold);padding:7px 16px;display:flex;align-items:flex-start;gap:10px;pointer-events:none;transition:opacity 0.4s;}
  .event-banner.hidden{opacity:0;}
  .event-tag{font-family:'Cinzel',serif;font-size:8px;letter-spacing:2px;color:var(--gold);border:1px solid var(--gold);padding:2px 5px;white-space:nowrap;margin-top:2px;flex-shrink:0;}
  .event-text{font-family:'Crimson Pro',serif;font-size:13px;color:var(--parchment);font-style:italic;line-height:1.4;}
  .legend{position:absolute;top:10px;left:10px;background:rgba(26,16,8,0.88);border:1px solid var(--gold);padding:8px 11px;pointer-events:none;max-width:185px;}
  .legend-title{font-family:'Cinzel',serif;font-size:7px;letter-spacing:2px;color:var(--gold);margin-bottom:5px;text-transform:uppercase;}
  .legend-item{display:flex;align-items:center;gap:5px;margin-bottom:3px;}
  .legend-swatch{width:13px;height:9px;border:0.5px solid rgba(255,255,255,0.2);flex-shrink:0;}
  .legend-text{font-family:'Crimson Pro',serif;font-size:10px;color:var(--parchment);}
  .map-tooltip{position:absolute;background:rgba(26,16,8,0.96);border:1px solid var(--gold);padding:7px 11px;pointer-events:none;opacity:0;transition:opacity 0.15s;max-width:240px;z-index:100;}
  .map-tooltip.visible{opacity:1;}
  .tooltip-name{font-family:'Cinzel',serif;font-size:11px;color:var(--gold-light);margin-bottom:3px;}
  .tooltip-body{font-family:'Crimson Pro',serif;font-size:12px;color:var(--parchment);font-style:italic;line-height:1.4;}
  .loading-screen{position:absolute;inset:0;background:#1e3a4a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:200;transition:opacity 0.6s;}
  .loading-screen.gone{opacity:0;pointer-events:none;}
  .loading-title{font-family:'Cinzel',serif;font-size:18px;color:var(--gold-light);letter-spacing:4px;}
  .loading-sub{font-family:'Crimson Pro',serif;font-style:italic;color:#a09070;font-size:13px;}
  .loading-bar-wrap{width:200px;height:3px;background:#2a3a4a;border:1px solid var(--gold);}
  .loading-bar{height:100%;background:var(--gold);width:0%;transition:width 0.3s;}
  .controls{background:var(--ink);border-top:2px solid var(--gold);padding:10px 20px;flex-shrink:0;}
  .controls-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
  .yr-group{display:flex;align-items:center;gap:5px;}
  .yr-group label{font-family:'Cinzel',serif;font-size:8px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;}
  .year-input{background:transparent;border:1px solid var(--gold);color:var(--gold-light);font-family:'Cinzel',serif;font-size:12px;padding:3px 7px;width:65px;text-align:center;outline:none;}
  .btn{background:transparent;border:1px solid var(--gold);color:var(--gold-light);font-family:'Cinzel',serif;font-size:9px;letter-spacing:1px;padding:4px 10px;cursor:pointer;transition:all 0.15s;white-space:nowrap;}
  .btn:hover{background:var(--gold);color:var(--ink);}
  .btn.active{background:var(--gold);color:var(--ink);}
  .speed-group{display:flex;align-items:center;gap:5px;margin-left:auto;}
  .speed-group label{font-family:'Cinzel',serif;font-size:8px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;}
  .speed-select{background:transparent;border:1px solid var(--gold);color:var(--gold-light);font-family:'Cinzel',serif;font-size:10px;padding:3px 7px;outline:none;cursor:pointer;}
  .speed-select option{background:var(--ink);}
  .slider-row{display:flex;align-items:center;gap:10px;}
  .slider-label{font-family:'Cinzel',serif;font-size:8px;color:#a09070;letter-spacing:1px;white-space:nowrap;width:38px;text-align:right;}
  .slider-label:last-child{text-align:left;}
  input[type=range]{flex:1;-webkit-appearance:none;height:3px;background:linear-gradient(to right,var(--gold) var(--pct,0%),#3a2a1a var(--pct,0%));outline:none;cursor:pointer;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--gold-light);border:2px solid var(--parchment);cursor:grab;}
  input[type=range]::-webkit-slider-thumb:active{cursor:grabbing;}
  input[type=range]{flex:1;-webkit-appearance:none;height:5px;background:linear-gradient(to right,var(--gold) var(--pct,0%),#3a2a1a var(--pct,0%));outline:none;cursor:pointer;border-radius:3px;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--gold-light);border:3px solid var(--parchment);cursor:grab;box-shadow:0 0 6px rgba(180,134,11,0.5);}
  .header-slider-row{display:flex;align-items:center;gap:12px;margin-top:8px;width:100%;}
  .header-slider-label{font-family:'Cinzel',serif;font-size:9px;color:#a09070;letter-spacing:1px;white-space:nowrap;}
  header{flex-direction:column;align-items:stretch;gap:0;}
  .header-top{display:flex;align-items:center;justify-content:space-between;width:100%;}
</style>
</head>
<body>
<header>
  <div class="header-top">
    <div style="display:flex;align-items:baseline">
      <h1>Atlas of Empires</h1>
      <div class="subtitle">A living history of the world, 500 – 1994 AD</div>
    </div>
    <div class="year-display" id="year-display">500<span>Anno Domini</span></div>
  </div>
  <div class="header-slider-row">
    <span class="header-slider-label">500 AD</span>
    <input type="range" id="year-slider" min="500" max="1994" value="500" step="1" oninput="onSliderInput(this.value)">
    <span class="header-slider-label">1994 AD</span>
  </div>
</header>
<div class="main-layout">
  <div class="map-container" id="map-container">
    <div class="loading-screen" id="loading-screen">
      <div class="loading-title">ATLAS OF EMPIRES</div>
      <div class="loading-sub">Loading geographic data…</div>
      <div class="loading-bar-wrap"><div class="loading-bar" id="loading-bar"></div></div>
    </div>
    <svg id="map-svg"></svg>
    <div class="legend" id="legend"></div>

    <!-- Zoom controls -->
    <div style="position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:4px;z-index:50">
      <button class="btn" onclick="zoomIn()" title="Zoom in" style="width:32px;height:32px;padding:0;font-size:16px">+</button>
      <button class="btn" onclick="zoomOut()" title="Zoom out" style="width:32px;height:32px;padding:0;font-size:16px">−</button>
      <button class="btn" onclick="resetZoom()" title="Reset view" style="width:32px;height:32px;padding:0;font-size:11px;letter-spacing:0">⌂</button>
    </div>
    <div class="map-tooltip" id="tooltip">
      <div class="tooltip-name" id="tooltip-name"></div>
      <div class="tooltip-body" id="tooltip-body"></div>
    </div>
    <div class="event-banner hidden" id="event-banner">
      <div class="event-tag">Event</div>
      <div class="event-text" id="event-text"></div>
    </div>
  </div>
  <div class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Active States</div>
      <div style="font-size:10px;color:var(--ink-light);font-style:italic;margin-bottom:8px" id="snapshot-label">Loading…</div>
      <div id="empire-list"></div>
    </div>
    <div class="info-panel" id="info-panel">
      <div class="sidebar-label">Selected</div>
      <p style="font-size:12px;color:var(--ink-light);font-style:italic;margin-top:6px">Click an empire on the map or in the list to learn more.</p>
    </div>
  </div>
</div>
<div class="controls">
  <div class="controls-row">
    <div class="yr-group"><label>From</label><input type="text" class="year-input" id="range-start" value="500"></div>
    <div class="yr-group"><label>To</label><input type="text" class="year-input" id="range-end" value="1500"></div>
    <button class="btn" id="play-btn" onclick="togglePlay()">&#9654; Play</button>
    <button class="btn" onclick="stepYear(-10)">&#8592; 10</button>
    <button class="btn" onclick="stepYear(-1)">&#8592; 1</button>
    <button class="btn" onclick="stepYear(1)">1 &#8594;</button>
    <button class="btn" onclick="stepYear(10)">10 &#8594;</button>
    <div class="speed-group">
      <label>Speed</label>
      <select class="speed-select" id="speed-select">
        <option value="2000">Slow</option>
        <option value="1000" selected>Medium</option>
        <option value="400">Fast</option>
        <option value="100">Very Fast</option>
      </select>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>

// All available snapshot years from your data/ folder
const SNAPSHOT_YEARS = [500,600,700,800,900,1000,1100,1200,1279,1300,1400,1492,1500,1530,1600,1650,1700,1715,1783,1800,1815,1880,1900,1914,1920,1930,1938,1945,1960,1994];

// Find the closest snapshot year at or before the current year
function getSnapshotYear(year) {
  let closest = SNAPSHOT_YEARS[0];
  for (const y of SNAPSHOT_YEARS) {
    if (y <= year) closest = y;
    else break;
  }
  return closest;
}

function getEmpireColor(name) {
  if (!name) return EMPIRE_COLORS['default'];
  // Exact match first
  if (EMPIRE_COLORS[name]) return EMPIRE_COLORS[name];
  // Partial match
  for (const key of Object.keys(EMPIRE_COLORS)) {
    if (key !== 'default' && name.includes(key)) return EMPIRE_COLORS[key];
  }
  return EMPIRE_COLORS['default'];
}

// Cache loaded GeoJSON files so we don't re-fetch them
const geoCache = {};

async function loadSnapshot(year) {
  const snap = getSnapshotYear(year);
  if (geoCache[snap]) return geoCache[snap];
  try {
    const data = await d3.json(`data/world_${snap}.geojson`);
    geoCache[snap] = data;
    return data;
  } catch(e) {
    console.warn(`Could not load data/world_${snap}.geojson`, e);
    return null;
  }
}

let currentYear=500, playing=false, playInterval=null, selectedEmpire=null;
let projection, pathGen, svg, W, H, mapGroup, zoomBehavior, currentTransform=d3.zoomIdentity;

async function initMap(){
  const container=document.getElementById('map-container');
  W=container.clientWidth; H=container.clientHeight;
  svg=d3.select('#map-svg').attr('width',W).attr('height',H);

  // Natural Earth projection
  projection=d3.geoNaturalEarth1().scale(W/6.4).translate([W/2,H/2]);
  pathGen=d3.geoPath().projection(projection);

  // Animate loading bar
  const bar=document.getElementById('loading-bar');
  let p=0;
  const iv=setInterval(()=>{p=Math.min(p+Math.random()*12,88);bar.style.width=p+'%';if(p>=88)clearInterval(iv);},180);

  let world;
  try{
    world=await d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
  }catch(e){
    document.getElementById('loading-screen').innerHTML='<div style="color:#d4a017;font-family:Cinzel,serif;font-size:14px;text-align:center;letter-spacing:2px;padding:20px">Could not load map data.<br><br>Please check your internet connection<br>and reload the file.</div>';
    return;
  }

  bar.style.width='100%';

  // Single group that zoom/pan will transform — everything lives inside this
  mapGroup = svg.append('g').attr('id','map-group');

  // Ocean sphere
  mapGroup.append('path').datum({type:'Sphere'}).attr('class','sphere').attr('d',pathGen);

  // Graticule grid
  mapGroup.append('path').datum(d3.geoGraticule()()).attr('class','graticule').attr('d',pathGen);

  // Real country outlines from Natural Earth / TopoJSON
  const countries=topojson.feature(world,world.objects.countries);
  mapGroup.append('g').attr('class','land-layer')
    .selectAll('path').data(countries.features).enter()
    .append('path').attr('class','land').attr('d',pathGen);

  // Empire and city layers sit above land
  mapGroup.append('g').attr('id','empires-layer');
  mapGroup.append('g').attr('id','cities-layer');

  // D3 zoom behavior — scroll to zoom, drag to pan, double-click to zoom in
  zoomBehavior = d3.zoom()
    .scaleExtent([1, 12])
    .on('zoom', (event) => {
      currentTransform = event.transform;
      mapGroup.attr('transform', event.transform);
      // Scale city dots and labels inversely so they stay readable when zoomed
      const k = event.transform.k;
      d3.selectAll('.city-dot').attr('r', function() {
        return (this.classList.contains('active') ? 4 : 2.5) / Math.sqrt(k);
      });
      d3.selectAll('.city-label').style('font-size', (9 / Math.sqrt(k)) + 'px');
      d3.selectAll('.pulse-ring').attr('r', 5 / Math.sqrt(k));
    });

  svg.call(zoomBehavior);

  // Prevent zoom from interfering with slider/controls
  svg.on('dblclick.zoom', null);
  svg.on('dblclick', (event) => {
    const [mx, my] = d3.pointer(event);
    svg.transition().duration(400).call(
      zoomBehavior.scaleBy, 2,
      [mx, my]
    );
  });

  setTimeout(()=>document.getElementById('loading-screen').classList.add('gone'),500);
  renderMap(currentYear);
}

// RENDER
// ============================================================
async function renderMap(year){
  renderEmpires(year);
  renderCities(year);
  checkEvents(year);
}

function renderSidebarFromGeo(features, year) {
  const list = document.getElementById('empire-list');
  // Get unique named states, preferring colored ones first
  const named = [...new Set(features.map(f => f.properties && f.properties.NAME).filter(Boolean))];
  const colored = named.filter(n => EMPIRE_COLORS[n] || Object.keys(EMPIRE_COLORS).some(k => k !== 'default' && n.includes(k)));
  const display = colored.length ? colored : named.slice(0, 15);

  if (!display.length) {
    list.innerHTML = '<p style="font-size:11px;color:var(--ink-light);font-style:italic">No named states found.</p>';
    return;
  }

  list.innerHTML = display.slice(0, 20).map(name => {
    const colors = getEmpireColor(name);
    return `<div class="empire-card ${selectedEmpire === name ? 'selected' : ''}"
      style="border-left-color:${colors.stroke}"
      onclick="selectEmpireByName('${name.replace(/'/g,"\\'")}')">
      <div class="empire-name">${name}</div>
      <div class="empire-dates">${getSnapshotYear(year)} AD snapshot</div>
    </div>`;
  }).join('');
}

async function renderEmpires(year){
  const layer=document.getElementById('empires-layer');
  layer.innerHTML='';

  const geo = await loadSnapshot(year);
  if (!geo) return;

  const snap = getSnapshotYear(year);

  // Update sidebar snapshot indicator
  const snapEl = document.getElementById('snapshot-label');
  if (snapEl) snapEl.textContent = `Showing borders: ${snap} AD`;

  geo.features.forEach(feature => {
    const name = feature.properties && feature.properties.NAME;
    const colors = getEmpireColor(name);

    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    const d = pathGen(feature);
    if (!d) return;

    path.setAttribute('d', d);
    path.setAttribute('fill', selectedEmpire === name ? colors.fill.replace(/[\d.]+\)$/, '0.75)') : colors.fill);
    path.setAttribute('stroke', colors.stroke);
    path.setAttribute('stroke-width', selectedEmpire === name ? '1.5' : '0.4');
    path.setAttribute('stroke-linejoin','round');
    path.style.cursor = 'pointer';

    path.addEventListener('mouseenter', e => {
      if (name) showTip(e, name, `${snap} AD snapshot`);
    });
    path.addEventListener('mousemove', moveTip);
    path.addEventListener('mouseleave', hideTip);
    path.addEventListener('click', () => {
      if (name) selectEmpireByName(name);
    });

    layer.appendChild(path);
  });

  // Update sidebar empire list from GeoJSON names
  renderSidebarFromGeo(geo.features, year);
}

function renderCities(year){
  const layer=document.getElementById('cities-layer');
  layer.innerHTML='';
  const event=EVENTS.find(ev=>Math.abs(ev.year-year)<=1);
  CITIES.forEach(city=>{
    if(year<city.founded-50)return;
    const [x,y]=projection([city.lon,city.lat])||[null,null];
    if(!x)return;
    const pulsing=event&&event.city===city.id;
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','city-group');
    if(pulsing){
      const ring=document.createElementNS('http://www.w3.org/2000/svg','circle');
      ring.setAttribute('cx',x);ring.setAttribute('cy',y);ring.setAttribute('r','5');
      ring.setAttribute('class','pulse-ring');g.appendChild(ring);
    }
    const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');
    dot.setAttribute('cx',x);dot.setAttribute('cy',y);dot.setAttribute('r',pulsing?'4':'2.5');
    dot.setAttribute('class',pulsing?'city-dot active':'city-dot');g.appendChild(dot);
    const lbl=document.createElementNS('http://www.w3.org/2000/svg','text');
    lbl.setAttribute('x',x+6);lbl.setAttribute('y',y-5);
    lbl.setAttribute('class',pulsing?'city-label active':'city-label');
    lbl.textContent=city.name;g.appendChild(lbl);
    g.addEventListener('mouseenter',e=>showTip(e,city.name,city.desc||'Major historical city'));
    g.addEventListener('mousemove',moveTip);g.addEventListener('mouseleave',hideTip);
    layer.appendChild(g);
  });
}

function renderSidebar(year){
  const list=document.getElementById('empire-list');
  const active=EMPIRES.filter(e=>year>=e.start&&year<=e.end);
  if(!active.length){list.innerHTML='<p style="font-size:11px;color:var(--ink-light);font-style:italic">No major empires in dataset for this year.</p>';return;}
  list.innerHTML=active.map(e=>`
    <div class="empire-card ${selectedEmpire===e.id?'selected':''}" style="border-left-color:${e.border}" onclick="selectEmpire('${e.id}')">
      <div class="empire-name">${e.name}</div>
      <div class="empire-dates">${e.start} – ${e.end} AD</div>
    </div>`).join('');
}

function renderLegend(active){
  const legend=document.getElementById('legend');
  if(!active.length){legend.innerHTML='';return;}
  legend.innerHTML=`<div class="legend-title">Active Empires</div>`+active.slice(0,10).map(e=>`
    <div class="legend-item">
      <div class="legend-swatch" style="background:${e.color};border-color:${e.border}"></div>
      <span class="legend-text">${e.name}</span>
    </div>`).join('');
}

function checkEvents(year){
  const event=EVENTS.find(ev=>Math.abs(ev.year-year)<=1);
  const banner=document.getElementById('event-banner');
  if(event){document.getElementById('event-text').textContent=`${event.year} — ${event.text}`;banner.classList.remove('hidden');}
  else{banner.classList.add('hidden');}
}

function selectEmpireByName(name) {
  selectedEmpire = selectedEmpire === name ? null : name;
  renderMap(currentYear);

  if (selectedEmpire) {
    // Check if we have detailed info in EMPIRES dataset
    const emp = EMPIRES.find(e => e.name === name || name.includes(e.name) || e.name.includes(name));
    const colors = getEmpireColor(name);
    const peaks = emp ? (emp.peaks||[]).map(p =>
      `<div style="margin-top:6px;padding:6px 8px;background:var(--parchment-dark);border-left:2px solid var(--gold);font-size:11px">
        <strong style="font-family:Cinzel,serif;font-size:9px;letter-spacing:1px">${p.year} AD</strong><br>${p.desc}
      </div>`).join('') : '';

    document.getElementById('info-panel').innerHTML = `
      <div class="sidebar-label">Selected</div>
      <div style="margin-top:8px">
        <div style="font-family:Cinzel,serif;font-size:13px;color:var(--ink);margin-bottom:3px">${name}</div>
        <div style="font-size:11px;color:var(--gold);margin-bottom:8px;font-style:italic">
          ${emp ? `${emp.start} – ${emp.end} AD` : `Active in ${getSnapshotYear(currentYear)} AD`}
        </div>
        <p style="font-size:12px;line-height:1.6;color:var(--ink-light)">
          ${emp ? emp.description : 'Select an empire to see detailed information. More empire descriptions will be added as the dataset grows.'}
        </p>
        ${peaks ? `<div style="margin-top:10px"><div class="sidebar-label" style="margin-bottom:4px">Key Moments</div>${peaks}</div>` : ''}
      </div>`;
  }
}

function selectEmpire(id){
  const emp = EMPIRES.find(e => e.id === id);
  if (emp) selectEmpireByName(emp.name);
}

function zoomIn(){svg.transition().duration(300).call(zoomBehavior.scaleBy,2);}
function zoomOut(){svg.transition().duration(300).call(zoomBehavior.scaleBy,0.5);}
function resetZoom(){svg.transition().duration(500).call(zoomBehavior.transform,d3.zoomIdentity);}

function showTip(e,name,body){
  document.getElementById('tooltip-name').textContent=name;
  document.getElementById('tooltip-body').textContent=body;
  document.getElementById('tooltip').classList.add('visible');
  moveTip(e);
}
function moveTip(e){
  const rect=document.getElementById('map-container').getBoundingClientRect();
  const tt=document.getElementById('tooltip');
  let x=e.clientX-rect.left+14, y=e.clientY-rect.top+14;
  if(x+250>rect.width)x-=265;if(y+90>rect.height)y-=90;
  tt.style.left=x+'px';tt.style.top=y+'px';
}
function hideTip(){document.getElementById('tooltip').classList.remove('visible');}

// YEAR CONTROLS
// ============================================================
function setYear(y){
  y=Math.max(500,Math.min(1994,Math.round(y)));
  currentYear=y;
  document.getElementById('year-display').innerHTML=`${y}<span>Anno Domini</span>`;
  const slider=document.getElementById('year-slider');
  slider.value=y;
  slider.style.setProperty('--pct',((y-500)/(1994-500)*100)+'%');
  renderMap(y);
}
function stepYear(d){setYear(currentYear+d);}
function onSliderInput(v){setYear(parseInt(v));}

function togglePlay(){
  playing=!playing;
  const btn=document.getElementById('play-btn');
  if(playing){
    let s=Math.max(500,Math.min(1994,parseInt(document.getElementById('range-start').value)||500));
    let e=Math.max(s+1,Math.min(1994,parseInt(document.getElementById('range-end').value)||1500));
    if(currentYear<s||currentYear>=e)setYear(s);
    btn.textContent='⏸ Pause';btn.classList.add('active');
    const speed=parseInt(document.getElementById('speed-select').value);
    playInterval=setInterval(()=>{if(currentYear>=e){togglePlay();return;}setYear(currentYear+1);},speed);
  }else{
    btn.textContent='▶ Play';btn.classList.remove('active');clearInterval(playInterval);
  }
}

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight')stepYear(e.shiftKey?10:1);
  if(e.key==='ArrowLeft')stepYear(e.shiftKey?-10:-1);
  if(e.key===' '){e.preventDefault();togglePlay();}
});

window.addEventListener('resize',()=>{
  W=document.getElementById('map-container').clientWidth;
  H=document.getElementById('map-container').clientHeight;
  if(projection){
    projection.scale(W/6.4).translate([W/2,H/2]);
    svg.attr('width',W).attr('height',H);
    // Redraw static layers at new size
    svg.select('.sphere').attr('d',pathGen);
    svg.select('.graticule').attr('d',pathGen);
    svg.select('.land-layer').selectAll('path').attr('d',pathGen);
    renderMap(currentYear);
  }
});

initMap();
</script>
</body>
</html>
